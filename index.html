<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - InventarioPro</title>
  <!-- Bootstrap 5 desde internet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <!-- Alerta para mensajes del sistema -->
    <div id="alerta" class="alert alert-info alert-dismissible">
      Bienvenido. Ingrese sus credenciales.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tarjeta centrada -->
    <div class="card shadow mx-auto" style="max-width: 400px;">
      <div class="card-body text-center">
        <h2>Acceso</h2>
        <span class="badge bg-primary mb-3">Control de Usuarios</span>

        <form onsubmit="return ingresar()" class="text-start">
          <label class="form-label">Correo / Usuario</label>
          <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="email" id="correo" class="form-control" placeholder="usuario@dominio.com">
          </div>

          <label class="form-label">Contraseña</label>
          <input type="password" id="clave" class="form-control mb-3">

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="recordar">
            <label class="form-check-label" for="recordar">Recordar sesión en este equipo</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Ingresar al Panel</button>
        </form>

        <div class="mt-3">
          <a href="cuenta_nueva.html">Registrar Nueva Cuenta</a> |
          <a href="olvide_contrasena.html">Olvidé mi contraseña</a>
        </div>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Funcion que se ejecuta al darle al boton Ingresar
  function ingresar() {
    var correo = document.getElementById("correo").value;
    var clave = document.getElementById("clave").value;
    var alerta = document.getElementById("alerta");

    // Validacion: campos vacios
    if (correo == "" || clave == "") {
      alerta.className = "alert alert-warning";
      alerta.innerHTML = "Complete todos los campos.";
      return false;
    }

    // Traemos los usuarios guardados (si no hay, lista vacia)
    var usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // Buscamos si existe el usuario
    var encontrado = null;
    for (var i = 0; i < usuarios.length; i++) {
      if (usuarios[i].correo == correo && usuarios[i].clave == clave) {
        encontrado = usuarios[i];
      }
    }

    if (encontrado != null) {
      // Guardamos quien inicio sesion y pasamos al panel
      localStorage.setItem("sesion", encontrado.nombres);
      window.location.href = "panel_control.html";
    } else {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Correo o contraseña incorrectos.";
    }
    return false; // para que no recargue la pagina
  }
</script>
</body>
</html>
