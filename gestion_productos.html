<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Productos - InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="panel_control.html">Panel de Control</a></li>
        <li class="breadcrumb-item active">Registro de Producto</li>
      </ol>
    </nav>

    <div class="d-flex justify-content-between mb-3">
      <h2>Nuevo Producto <span class="badge bg-secondary">Inventario</span></h2>
      <a href="panel_control.html" class="btn btn-outline-secondary">Volver al Panel</a>
    </div>

    <!-- Aqui salen los errores -->
    <div id="error" class="alert alert-danger d-none"></div>

    <!-- FORMULARIO PARA CREAR PRODUCTO -->
    <form class="card card-body mb-4" onsubmit="return guardar()">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Nombre del Producto</label>
          <input type="text" id="nombre" class="form-control" placeholder="Ej. Teclado Mecánico RGB">
        </div>
        <div class="col-md-6">
          <label class="form-label">Código SKU</label>
          <input type="text" id="sku" class="form-control" placeholder="PROD-001">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Categorías Asignadas (Ctrl para elegir varias)</label>
        <select id="categorias" class="form-select" multiple size="4">
          <option>Periféricos</option>
          <option>Soporte Técnico</option>
          <option>Facturación</option>
          <option>Ventas</option>
        </select>
      </div>

      <!-- Botones de disponibilidad -->
      <div class="mb-3">
        <label class="form-label d-block">Disponibilidad Inicial</label>
        <div class="btn-group">
          <input type="radio" class="btn-check" name="estado" id="e1" value="En Stock" checked>
          <label class="btn btn-outline-primary" for="e1">En Stock</label>
          <input type="radio" class="btn-check" name="estado" id="e2" value="Agotado">
          <label class="btn btn-outline-primary" for="e2">Agotado</label>
          <input type="radio" class="btn-check" name="estado" id="e3" value="Descontinuado">
          <label class="btn btn-outline-primary" for="e3">Descontinuado</label>
        </div>
      </div>

      <div class="mb-3" style="max-width: 200px;">
        <label class="form-label">Cantidad</label>
        <input type="number" id="cantidad" class="form-control" value="0" min="0">
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="publicar" checked>
        <label class="form-check-label" for="publicar">Publicar inmediatamente en el catálogo general</label>
      </div>

      <div>
        <button type="submit" class="btn btn-primary">Guardar Producto</button>
        <a href="panel_control.html" class="btn btn-outline-danger">Cancelar</a>
      </div>
    </form>

    <!-- LISTA DE PRODUCTOS (con botones Editar y Eliminar) -->
    <h4>Productos registrados</h4>
    <div class="table-responsive">
      <table class="table table-striped bg-white">
        <thead class="table-dark">
          <tr><th>SKU</th><th>Nombre</th><th>Categorías</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Si no hay sesion, volvemos al inicio
  if (localStorage.getItem("sesion") == null) {
    window.location.href = "index.html";
  }

  // Esta funcion dibuja la tabla con los productos guardados
  function mostrarProductos() {
    var productos = JSON.parse(localStorage.getItem("productos")) || [];
    var filas = "";
    for (var i = 0; i < productos.length; i++) {
      var p = productos[i];
      filas = filas + "<tr>" +
        "<td>" + p.sku + "</td>" +
        "<td>" + p.nombre + "</td>" +
        "<td>" + p.categorias.join(", ") + "</td>" +
        "<td><span class='badge bg-success'>" + p.estado + "</span></td>" +
        "<td>" +
          "<a href='modificar_producto.html?sku=" + p.sku + "' class='btn btn-sm btn-warning'>Editar</a> " +
          "<a href='eliminar_producto.html?sku=" + p.sku + "' class='btn btn-sm btn-danger'>Eliminar</a>" +
        "</td></tr>";
    }
    document.getElementById("tabla").innerHTML = filas;
  }

  // Funcion para mostrar un error
  function mostrarError(mensaje) {
    var error = document.getElementById("error");
    error.innerHTML = mensaje;
    error.classList.remove("d-none");
  }

  // Funcion que guarda el producto nuevo
  function guardar() {
    var nombre = document.getElementById("nombre").value;
    var sku = document.getElementById("sku").value.toUpperCase();
    var cantidad = document.getElementById("cantidad").value;
    var publicado = document.getElementById("publicar").checked;
    var estado = document.querySelector("input[name='estado']:checked").value;

    // Sacamos las categorias elegidas
    var categorias = [];
    var opciones = document.getElementById("categorias").options;
    for (var i = 0; i < opciones.length; i++) {
      if (opciones[i].selected) {
        categorias.push(opciones[i].value);
      }
    }

    // Validaciones
    if (nombre == "" || sku == "") {
      mostrarError("El nombre y el SKU son obligatorios.");
      return false;
    }
    if (categorias.length == 0) {
      mostrarError("Seleccione al menos una categoría.");
      return false;
    }

    // Revisamos que el SKU no se repita
    var productos = JSON.parse(localStorage.getItem("productos")) || [];
    for (var j = 0; j < productos.length; j++) {
      if (productos[j].sku == sku) {
        mostrarError("Ya existe un producto con ese SKU.");
        return false;
      }
    }

    // Guardamos
    productos.push({ sku: sku, nombre: nombre, categorias: categorias, estado: estado, cantidad: cantidad, publicado: publicado });
    localStorage.setItem("productos", JSON.stringify(productos));

    alert("Producto guardado");
    window.location.href = "gestion_productos.html";
    return false;
  }

  mostrarProductos();
</script>
</body>
</html>
