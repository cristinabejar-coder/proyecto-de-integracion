<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Control - InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="panel_control.html">Inicio</a></li>
        <li class="breadcrumb-item active">Panel de Control</li>
      </ol>
    </nav>

    <!-- Alerta de bienvenida que se puede cerrar -->
    <div class="alert alert-info alert-dismissible">
      Bienvenido al panel general del sistema, <b id="usuario"></b>.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between mb-3">
      <h2>Panel Operativo</h2>
      <div>
        <button class="btn btn-primary">Mensajes <span class="badge bg-danger">4</span></button>
        <button class="btn btn-outline-secondary" onclick="salir()">Salir</button>
      </div>
    </div>

    <!-- Grilla: menu a la izquierda y tarjetas a la derecha -->
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="list-group">
          <a href="panel_control.html" class="list-group-item list-group-item-action active">Inicio</a>
          <a href="gestion_productos.html" class="list-group-item list-group-item-action">Productos</a>
          <a href="#" class="list-group-item list-group-item-action" data-bs-toggle="modal" data-bs-target="#modalUsuarios">Usuarios</a>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5>Stock Disponible</h5>
            <span class="badge bg-success" id="stock">0 Unidades</span>
          </div>
        </div>
      </div>

      <div class="col-md-5 mb-3">
        <div class="card">
          <div class="card-body">
            <h5>Avisos Pendientes</h5>
            <span class="badge bg-warning text-dark" id="criticos">0 Críticos</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal que muestra los usuarios registrados -->
  <div class="modal fade" id="modalUsuarios" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Usuarios registrados</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <table class="table">
            <thead><tr><th>Nombres</th><th>Apellidos</th><th>Correo</th></tr></thead>
            <tbody id="tablaUsuarios"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Si no hay sesion, lo mandamos al inicio
  var sesion = localStorage.getItem("sesion");
  if (sesion == null) {
    window.location.href = "index.html";
  }
  document.getElementById("usuario").innerHTML = sesion;

  // Calculamos las metricas con los productos guardados
  var productos = JSON.parse(localStorage.getItem("productos")) || [];
  var stock = 0;
  var criticos = 0;
  for (var i = 0; i < productos.length; i++) {
    stock = stock + Number(productos[i].cantidad);
    if (productos[i].estado == "Agotado" || Number(productos[i].cantidad) < 5) {
      criticos = criticos + 1;
    }
  }
  document.getElementById("stock").innerHTML = stock + " Unidades";
  document.getElementById("criticos").innerHTML = criticos + " Críticos";

  // Llenamos la tabla de usuarios del modal
  var usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
  var filas = "";
  for (var j = 0; j < usuarios.length; j++) {
    filas = filas + "<tr><td>" + usuarios[j].nombres + "</td><td>" + usuarios[j].apellidos + "</td><td>" + usuarios[j].correo + "</td></tr>";
  }
  document.getElementById("tablaUsuarios").innerHTML = filas;

  // Cerrar sesion
  function salir() {
    localStorage.removeItem("sesion");
    window.location.href = "index.html";
  }
</script>
</body>
</html>
