<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olvidé mi contraseña - InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <!-- Breadcrumb -->
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item"><a href="index.html">Login</a></li>
        <li class="breadcrumb-item active">Recuperar Contraseña</li>
      </ol>
    </nav>

    <!-- Alerta para mensajes -->
    <div id="alerta" class="alert alert-info alert-dismissible">
      Ingrese su correo y escriba una nueva contraseña.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow mx-auto" style="max-width: 450px;">
      <div class="card-body">
        <div class="text-center">
          <h3>Recuperar Contraseña</h3>
          <span class="badge bg-warning text-dark mb-3">Control de Usuarios</span>
        </div>

        <form onsubmit="return cambiar()">
          <label class="form-label">Correo Electrónico</label>
          <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="email" id="correo" class="form-control" placeholder="usuario@dominio.com">
          </div>

          <!-- Contraseñas en paralelo -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Nueva Contraseña</label>
              <input type="password" id="clave" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirmar Contraseña</label>
              <input type="password" id="clave2" class="form-control">
            </div>
          </div>

          <button type="submit" class="btn btn-warning w-100">Cambiar Contraseña</button>
        </form>

        <hr>
        <p class="text-center mb-0"><a href="index.html">Volver al Inicio</a></p>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function cambiar() {
    var correo = document.getElementById("correo").value;
    var clave = document.getElementById("clave").value;
    var clave2 = document.getElementById("clave2").value;
    var alerta = document.getElementById("alerta");

    // Validaciones basicas
    if (correo == "" || clave == "" || clave2 == "") {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Todos los campos son obligatorios.";
      return false;
    }
    if (clave.length < 6) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "La contraseña debe tener minimo 6 caracteres.";
      return false;
    }
    if (clave != clave2) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Las contraseñas no coinciden.";
      return false;
    }

    // Buscamos el correo en los usuarios guardados
    var usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
    var posicion = -1;
    for (var i = 0; i < usuarios.length; i++) {
      if (usuarios[i].correo == correo) {
        posicion = i;
      }
    }

    // Si no existe el correo, mostramos error
    if (posicion == -1) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Ese correo no esta registrado.";
      return false;
    }

    // Cambiamos la contraseña y guardamos
    usuarios[posicion].clave = clave;
    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    alert("Contraseña cambiada correctamente");
    window.location.href = "index.html";
    return false;
  }
</script>
</body>
</html>
