<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta Nueva - InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <!-- Breadcrumb -->
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item"><a href="index.html">Login</a></li>
        <li class="breadcrumb-item active">Registro de Usuario</li>
      </ol>
    </nav>

    <div id="alerta" class="alert alert-info alert-dismissible">
      Complete el formulario para crear un nuevo usuario y acceder al sistema.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <div class="text-center">
          <h3>Crear Nueva Cuenta</h3>
          <span class="badge bg-success mb-3">Nuevo Usuario</span>
        </div>

        <form onsubmit="return registrar()">
          <!-- Dos columnas: nombres y apellidos -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Nombres</label>
              <input type="text" id="nombres" class="form-control" placeholder="Juan">
            </div>
            <div class="col-md-6">
              <label class="form-label">Apellidos</label>
              <input type="text" id="apellidos" class="form-control" placeholder="Pérez">
            </div>
          </div>

          <label class="form-label">Correo Electrónico</label>
          <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="email" id="correo" class="form-control" placeholder="usuario@dominio.com">
          </div>

          <!-- Contraseñas en paralelo -->
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Contraseña</label>
              <input type="password" id="clave" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirmar Contraseña</label>
              <input type="password" id="clave2" class="form-control">
            </div>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="terminos">
            <label class="form-check-label" for="terminos">Acepto los términos y condiciones del sistema</label>
          </div>

          <button type="submit" class="btn btn-success w-100">Registrar Cuenta</button>
        </form>

        <hr>
        <p class="text-center mb-0">¿Ya tienes una cuenta? <a href="index.html"><b>Iniciar Sesión</b></a></p>
      </div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function registrar() {
    // Leemos los datos del formulario
    var nombres = document.getElementById("nombres").value;
    var apellidos = document.getElementById("apellidos").value;
    var correo = document.getElementById("correo").value;
    var clave = document.getElementById("clave").value;
    var clave2 = document.getElementById("clave2").value;
    var terminos = document.getElementById("terminos").checked;
    var alerta = document.getElementById("alerta");

    // Validaciones basicas
    if (nombres == "" || apellidos == "" || correo == "" || clave == "") {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Todos los campos son obligatorios.";
      return false;
    }
    if (clave.length < 6) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "La contraseña debe tener minimo 6 caracteres.";
      return false;
    }
    if (clave != clave2) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Las contraseñas no coinciden.";
      return false;
    }
    if (terminos == false) {
      alerta.className = "alert alert-danger";
      alerta.innerHTML = "Debe aceptar los términos y condiciones.";
      return false;
    }

    // Traemos los usuarios que ya existen
    var usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // Revisamos que el correo no este repetido
    for (var i = 0; i < usuarios.length; i++) {
      if (usuarios[i].correo == correo) {
        alerta.className = "alert alert-danger";
        alerta.innerHTML = "Ese correo ya esta registrado.";
        return false;
      }
    }

    // Agregamos el nuevo usuario y lo guardamos
    usuarios.push({ nombres: nombres, apellidos: apellidos, correo: correo, clave: clave });
    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    alert("Cuenta creada correctamente");
    window.location.href = "index.html";
    return false;
  }
</script>
</body>
</html>
