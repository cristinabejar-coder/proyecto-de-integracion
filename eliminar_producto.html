<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliminar Producto - InventarioPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">

    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="panel_control.html">Panel de Control</a></li>
        <li class="breadcrumb-item"><a href="gestion_productos.html">Productos</a></li>
        <li class="breadcrumb-item active">Eliminar Producto</li>
      </ol>
    </nav>

    <!-- Alerta de advertencia -->
    <div class="alert alert-danger">
      <h5>¡Atención! Confirmación requerida</h5>
      Esta acción no se puede deshacer. Se eliminará el registro permanentemente de la base de datos.
    </div>

    <!-- Tarjeta con los detalles -->
    <div class="card mb-3">
      <div class="card-body">
        <h5>Detalles del Registro:</h5>
        <p class="mb-1"><b>SKU:</b> <span id="dSku"></span></p>
        <p class="mb-1"><b>Producto:</b> <span id="dNombre"></span></p>
        <p class="mb-1"><b>Categoría:</b> <span id="dCategoria"></span></p>
        <p class="mb-0"><b>Estado Actual:</b> <span class="badge bg-success" id="dEstado"></span></p>
      </div>
    </div>

    <button class="btn btn-danger" onclick="eliminar()">Confirmar y Eliminar</button>
    <a href="gestion_productos.html" class="btn btn-secondary">Cancelar y Volver</a>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (localStorage.getItem("sesion") == null) {
    window.location.href = "index.html";
  }

  // Sacamos el SKU de la direccion
  var parametros = new URLSearchParams(window.location.search);
  var skuBuscado = parametros.get("sku");

  var productos = JSON.parse(localStorage.getItem("productos")) || [];
  var posicion = -1;

  for (var i = 0; i < productos.length; i++) {
    if (productos[i].sku == skuBuscado) {
      posicion = i;
    }
  }

  if (posicion == -1) {
    alert("Producto no encontrado");
    window.location.href = "gestion_productos.html";
  }

  // Mostramos los datos del producto
  var p = productos[posicion];
  document.getElementById("dSku").innerHTML = p.sku;
  document.getElementById("dNombre").innerHTML = p.nombre;
  document.getElementById("dCategoria").innerHTML = p.categorias.join(", ");
  document.getElementById("dEstado").innerHTML = p.estado;

  // Borra el producto de la lista
  function eliminar() {
    productos.splice(posicion, 1); // quita 1 elemento en esa posicion
    localStorage.setItem("productos", JSON.stringify(productos));
    alert("Producto eliminado");
    window.location.href = "gestion_productos.html";
  }
</script>
</body>
</html>
